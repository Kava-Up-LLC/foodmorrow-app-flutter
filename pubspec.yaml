name: foodmorrow_app
description: "Foodmorrow: know today what you cook tomorrow. Orders for people who sell homemade food, on AppAmbit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  appambit_sdk_flutter: ^1.2.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.2
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Ships with the Flutter SDK (like flutter_test); drives the real app on a real device
  # against the real AppAmbit backend. Not a third-party package.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/food/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
